name: RSS Ingest (手動補助)

# 無料AIクォータが厳しいため、定期実行は Vercel Cron の 1日1回 (JST 05:00) に集約。
# このワークフローは手動実行用のバックアップ。
on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/ingest/manual"
