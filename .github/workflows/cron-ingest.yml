name: RSS Ingest (補助Cron)

on:
  schedule:
    # JST 12:00 (UTC 03:00) と JST 21:00 (UTC 12:00) に追加実行
    # Vercel Hobby の JST 05:00 (UTC 20:00) と合わせて1日3回
    - cron: '0 3 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/ingest/manual"
